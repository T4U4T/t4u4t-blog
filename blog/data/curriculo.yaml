# Conteúdo principal do portfólio. Edite à vontade.
sobre:
  citacao:
    texto: "Age de tal modo que a máxima de tua vontade possa sempre valer ao mesmo tempo como princípio de uma legislação universal."
    autor: "Immanuel Kant"
  paragrafos:
    - "Sou **desenvolvedor de software**, **cientista de dados** em formação e entusiasta de **infraestrutura Linux**. Meu foco está na interseção entre construir ferramentas práticas, modelar dados e manter ambientes resilientes — atuando desde o desenvolvimento de aplicações, automações e extensões em **Python, JavaScript, TypeScript e SQL** até a administração de redes, containers e arquiteturas **self-hosted**. Minha vivência com operações críticas e análise em tempo real reforçou uma mentalidade pragmática: transformar problemas complexos e dados brutos em sistemas eficientes."
    - "Fora do terminal, cultivo uma postura **cética e analítica** diante do mundo. Dedico parte do meu tempo ao estudo da **filosofia**, da **ética deontológica** e da **investigação histórico-crítica** das civilizações e religiões antigas, aplicando o mesmo rigor lógico usado para depurar sistemas à compreensão das ideias e do comportamento humano."
    - "Quando não estou codando, testando hardware ou ajustando servidores, costumo estar tocando guitarra ou piano, explorando **análises quantitativas** ou mergulhando em boas histórias de ficção científica. Este espaço reúne notas, projetos e reflexões sobre tudo o que me instiga a entender como as coisas realmente funcionam."

projetos:
  - nome: "Bible"
    tipo: "Aplicação Web • Filologia & Crítica Histórica"
    texto: "Plataforma de estudo bíblico comparativo com 109 livros (canônicos, deuterocanônicos e apócrifos), interlinear Hebraico/Grego com morfologia Strong, Septuaginta (LXX) e ordenação por datação histórico-crítica acadêmica."
    stack: "Python • FastAPI • SQLite • JavaScript • Docker"
  - nome: "Freya"
    tipo: "Aplicação Web • Finanças & Dados"
    texto: "Plataforma de gestão financeira familiar com isolamento de dados via Row-Level Security, controle de faturas e leitura de código de barras para análise de consumo."
    stack: "TypeScript • React • PostgreSQL • Supabase"
  - nome: "LUCY"
    tipo: "Agente Autônomo • Segurança & IA Local"
    texto: "Assistente de linha de comando para cibersegurança e análise de ambientes Linux, integrando modelos locais via Ollama com execução assíncrona de ferramentas."
    stack: "Python • Ollama • Linux CLI"
  - nome: "t4zoo"
    tipo: "Simulação Científica • Neuroevolução & Dados"
    texto: "Ecossistema 2D contínuo de vida artificial em que criaturas com visão por raycasting e redes neurais feedforward em puro NumPy evoluem por algoritmos genéticos sob física metabólica realista."
    stack: "Python • NumPy • FastAPI • SQLite"
  - nome: "Stella"
    tipo: "Aplicação Web • Tracking & Mídia"
    texto: "Sistema web auto-hospedado para catalogação, avaliação e acompanhamento de obras audiovisuais e literárias, com integração de metadados externos e sorteio interativo via Canvas."
    stack: "TypeScript • React • Vite • Docker"
  - nome: "Homelab Telemetry & Power Monitor"
    tipo: "Infraestrutura • Linux & Observabilidade"
    texto: "Arquitetura distribuída de monitoramento de hardware e consumo energético em tempo real (RAPL/hwmon), consolidando telemetria entre nós locais e em nuvem via Tailscale."
    stack: "Python • Bash • Systemd • Docker"

