<header class="top" id="top-bar">
  <a class="logo" href="{{ "/" | relURL }}" aria-label="{{ site.Params.mark }}, início">{{ site.Params.mark }}<span class="dot">.</span></a>
  <nav aria-label="Seções">
    {{ $cur := .RelPermalink }}
    {{ range site.Menus.main }}
      {{- $href := .URL | relURL -}}
      {{- $active := cond (eq .URL "/") (eq $cur $href) (hasPrefix $cur $href) -}}
      <a href="{{ $href }}"{{ if $active }} class="on" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
  <div class="top-meta">
    <span class="where">{{ site.Params.location }}</span>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Ativar modo claro de leitura" title="Alternar modo claro / escuro">
      {{ partial "icon.html" "sun" }}
      {{ partial "icon.html" "moon" }}
    </button>
  </div>
</header>
